name: Deploy to FTP on master push

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug env
        run: |
          echo "Host: $FTP_HOST"
          echo "User: $FTP_USERNAME"
          # echo "Pass: $FTP_PASSWORD"  # liever niet loggen 😉
          echo "Remote dir: $FTP_REMOTE_DIR"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

      # Cache-JSON, de order-sqlite, locks en de root-.htaccess blijven op de server.
      # lftp: het laatste passende patroon wint. Includes staan daarom
      # ná de excludes, anders uploadt cache/.htaccess of data/.htaccess niet.
      - name: Deploy web/ to FTP (with delete & excludes)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" << EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-allow false
          set ftp:passive-mode yes

          cd "$FTP_REMOTE_DIR"

          # Server-only mappen (cache/, data/, uploads/) worden NIET gespiegeld, zodat --delete
          # daar nooit iets wist. Alleen de afschermbestanden gaan mee via put (geen --delete).
          mirror -R --delete \
            --exclude-glob .htaccess \
            --exclude-glob analytics/*.sqlite \
            --exclude-glob analytics/*.sqlite-* \
            --exclude-glob auth.php \
            --exclude-glob cache/ \
            --exclude-glob cache/** \
            --exclude-glob data/ \
            --exclude-glob data/** \
            --exclude-glob uploads/ \
            --exclude-glob uploads/** \
            ./web .

          mkdir -p -f cache
          mkdir -p -f cache/odata
          mkdir -p -f data
          put -O cache web/cache/.htaccess
          put -O cache web/cache/index.html
          put -O cache web/cache/index.php
          put -O cache/odata web/cache/odata/.htaccess
          put -O cache/odata web/cache/odata/index.html
          put -O cache/odata web/cache/odata/index.php
          put -O data web/data/.htaccess
          put -O data web/data/index.html
          put -O data web/data/index.php

          set cmd:fail-exit false
          chmod 777 analytics

          bye
          EOF
